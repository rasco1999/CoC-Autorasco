name: CoCAutorasco
options:
  bundleIdPrefix: iq.mur
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_CFBundleDisplayName: "CoC AutoRasco"
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "اختر صورة قرية الخصم لتحليلها وإعداد خطة هجوم يدوية."
targets:
  CoCAutorasco:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: iq.mur.cocautorasco
        PRODUCT_NAME: "CoC AutoRasco"
        SWIFT_EMIT_LOC_STRINGS: "YES"
